[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "MCP server for Obsidian via the Obsidian CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["obsidian", "mcp", "cli", "vault", "notes"]

dependencies = [
    "mcp>=1.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[project.urls]
Homepage = "https://github.com/chirantansoni/loom/tree/main/obsidian-mcp"
Issues = "https://github.com/chirantansoni/loom/issues"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
